<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Market-U | Campus Marketplace</title>

  <!-- iOS PWA: tells Safari this is a full-screen installable app -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Market-U" />
  <!-- iOS home screen icon -->
  <link rel="apple-touch-icon" href="/icon.png" />
  <!-- iOS: theme color for browser chrome -->
  <meta name="theme-color" content="#6C3CE1" />

  <!-- Primary Meta -->
  <meta name="description" content="Buy, sell & discover on Market-U — the trusted campus marketplace for students." />

  <!-- Open Graph / WhatsApp / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://marketu.store/" />
  <meta property="og:title" content="Market-U | Campus Marketplace" />
  <meta property="og:description" content="Buy, sell & discover on Market-U — the trusted campus marketplace for students." />
  <meta property="og:image" content="https://marketu.store/og-preview.jpg" />
  <meta property="og:image:secure_url" content="https://marketu.store/og-preview.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Market-U — Campus Marketplace for Students" />
  <meta property="og:site_name" content="Market-U" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card (also used by some platforms) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://marketu.store/" />
  <meta name="twitter:title" content="Market-U | Campus Marketplace" />
  <meta name="twitter:description" content="Buy, sell & discover on Market-U — the trusted campus marketplace for students." />
  <meta name="twitter:image" content="https://marketu.store/og-preview.jpg" />
</head>

<body>
  <div id="root">
    <!-- Pre-render splash: shown until React hydrates and removes this -->
    <div id="pre-splash" style="
      position:fixed;inset:0;
      background:#F8FAFC;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      gap:1.5rem;z-index:9999;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    ">
      <div style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;">
        <div style="
          width:64px;height:64px;border-radius:18px;
          background:linear-gradient(135deg,#7C3AED,#A78BFA,#F59E0B);
          display:flex;align-items:center;justify-content:center;
          font-size:2rem;
          box-shadow:0 8px 32px rgba(124,58,237,0.35);
        ">🛒</div>
        <span style="font-size:1.375rem;font-weight:800;letter-spacing:-0.03em;color:#0F172A;">Market-U</span>
      </div>
      <div style="display:flex;gap:6px;">
        <style>#pre-splash span{width:8px;height:8px;border-radius:50%;background:#7C3AED;display:inline-block;animation:db 1.2s ease-in-out infinite}#pre-splash span:nth-child(2){animation-delay:.2s}#pre-splash span:nth-child(3){animation-delay:.4s}@keyframes db{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}</style>
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(registration => {
          console.log('SW registered: ', registration);
        }).catch(registrationError => {
          console.log('SW registration failed: ', registrationError);
        });
      });
    }
  </script>
</body>

</html>
